name: CI

# Two jobs, because they fail for different reasons and one is far faster than
# the other. `lint` catches dead imports and ambiguous names in seconds; `test`
# runs the deterministic half of the pipeline (chunking, citation parsing, the
# refusal decision, the metric helpers) and needs the model stack to import.
#
# Neither job needs an API key. The sanity tests never call the generation
# backend, and the corpus itself is not in this repository (see the README) --
# so CI exercises exactly the code paths that depend on neither.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The CPU wheel, explicitly. The default torch wheel carries the CUDA
      # runtime -- roughly 2 GB the runner would download to run tests that
      # never touch a GPU.
      - name: Install torch (CPU wheel)
        run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q
