[theme]
base = "light"
primaryColor = "#176B5B"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#EFEEE9"
textColor = "#202C2A"
font = "sans serif"

[server]
address = "127.0.0.1"
maxUploadSize = 15
maxMessageSize = 25
enableXsrfProtection = true
enableCORS = true
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = "none"
