# ModuleMate — single source of truth for tunable parameters.
#
# NFR5 (Maintainability): k, the similarity threshold and all model names live
# here. No module hardcodes any of these three values; every consumer reads
# them through config.load(). A tutor refreshing the corpus or retuning the
# refusal gate never edits Python.

corpus:
  raw_dir: corpus/raw            # staged by scripts/collect_corpus.py
  converted_dir: corpus/converted # .pptx/.docx produced by scripts/convert_corpus.sh
  ocr_dir: corpus/ocr            # per-deck OCR text from scripts/ocr_slides.py

index:
  dir: index_store               # persisted FAISS index + chunk metadata
  # Chunking. Slides and PDF pages are short; only dense units are split.
  # Budget expressed in words, converted to tokens at ~1.3 tokens/word.
  chunk_target_words: 230        # ~300 tokens — mid-point of the 200-400 target
  chunk_overlap_words: 45        # ~20% overlap, preserves context across splits
  # Prose sources (assessment briefs, chat exports) list independent facts,
  # so they chunk line-wise at a tighter budget — see ingest.chunk_lines for
  # the measurement that motivated splitting this from the slide budget.
  chunk_target_words_docx: 32
  min_chunk_chars: 40            # drop title-only / decorative fragments
  # OCR noise filter — see ingest.is_informative. Chart axis labels and stray
  # glyphs embed as real vectors and compete for retrieval slots, so chunks
  # that are mostly digits/symbols or carry too few real words are discarded.
  min_alpha_ratio: 0.55
  min_word_tokens: 6
  # Notebook code cells are legitimately symbol-dense; the OCR-noise ratio
  # above would discard the very cells that answer "which function did the
  # lab use?", so code is held to a lower bar.
  min_alpha_ratio_code: 0.32
  # Share of letters that must be Latin, per chunk. The corpus contains
  # bilingual chat exports and a Chinese lab guide; all-MiniLM-L6-v2 is
  # English-trained, so a predominantly-CJK chunk can only displace an
  # English one from the top-k. Applied per chunk, so the English half of
  # a bilingual chat survives.
  min_latin_ratio: 0.60

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  normalize: true                # unit vectors => FAISS inner product == cosine
  batch_size: 64

retrieval:
  k: 5                           # top-k passages retrieved (FR5)
  # Refusal gate (M5/FR7). Calibrated empirically, not guessed — see
  # scripts/calibrate_threshold.py and results/threshold_calibration.md.
  # A query whose best weighted chunk scores below this is refused, not answered.
  #
  # 0.48 over the 63-question gold set against the full summer-school corpus:
  # in-scope top-1 similarity bottoms out at 0.457 and out-of-scope tops out at
  # 0.524, so the two distributions overlap slightly and no cut-off separates
  # them perfectly. Selection is retention-constrained rather than
  # Youden-optimal — it keeps 98.1% of in-scope questions and rejects 81.8% of
  # out-of-scope ones on similarity alone. The two it cannot reject are about
  # corpus topics but out of scope by policy; the intent router and the
  # generator's scope rule catch those. Raising it to 0.54 would reject 100%
  # at the gate but refuse 11.5% of legitimate questions, and a refusal
  # forfeits retrieval entirely, costing a hit@3 as well as an answer.
  similarity_threshold: 0.48
  # Candidates fetched per query before authority re-ranking, as a multiple
  # of k. Weighting only the first k would be pointless: a demoted chunk
  # would still hold its slot and the chunk it displaced was never fetched.
  # Chosen by sweeping recall depth against latency. Deeper recall does buy a
  # little accuracy — oversample 30 with 150 re-ranked candidates reaches
  # exact hit@3 0.942 — but costs 1.8 s/query against 0.43 s here, and NFR1 is
  # a stated requirement with only 5 s of headroom. 8 keeps exact hit@3 at
  # 0.923 and hit@5 at 0.942, comfortably above the 0.85 target, for a quarter
  # of the retrieval time. One gold question is the entire difference.
  oversample: 8
  # Source authority prior, multiplied into the cosine before ranking and
  # before the refusal gate. Matched by source_document filename prefix.
  # Group chats are in the corpus because staff post real announcements
  # there, but a classmate speculating about the word limit is not
  # authoritative: measured, a chat message scored 0.567 against the
  # assessment brief's own 0.552 for "what is the word limit?" and won.
  # 0.85 means a chat must be ~18% more similar to outrank an official
  # document, while still winning outright on questions only it answers
  # (check-in logistics, experiment deadlines announced in the group).
  default_authority: 1.0
  authority_weights:
    "chats__": 0.85

  # C1 — hybrid retrieval. Dense embeddings paraphrase well but blur exact
  # tokens, and this corpus is full of tokens that must match exactly: "ID3",
  # "4000-word", "AI_assignment_ID", "TF-IDF", "300 pull requests". BM25 is
  # fused with the dense ranking by Reciprocal Rank Fusion, which combines
  # orderings rather than scores, so BM25's unbounded scores never have to be
  # made commensurable with cosine.
  hybrid:
    enabled: true
    rrf_k: 60              # standard RRF damping constant
    weight_dense: 1.0
    weight_lexical: 0.8    # lexical is a corrective signal, not an equal vote

  # C2 — cross-encoder re-ranking of the fused shortlist. A bi-encoder embeds
  # query and passage independently; a cross-encoder reads them together and is
  # far better at deciding which of several passages *on the same topic*
  # actually answers the question — the locator-level distinction hit@3
  # measures. Runs on CPU over a shortlist only, so it costs tens of ms.
  rerank:
    enabled: true
    # L-12 over L-6: identical hit@3 and hit@5, but markedly better at rank 1
    # (exact P@1 0.769 vs 0.692, document P@1 0.923 vs 0.865) for +0.4 s/query.
    # Rank 1 is what the generator usually cites, so this buys citation
    # correctness rather than just retrieval recall.
    model: cross-encoder/ms-marco-MiniLM-L-12-v2
    candidates: 40         # fused passages re-scored; must be >= k
    # The cross-encoder contributes a third ranking to the fusion rather than
    # replacing the other two — see the measurement in retrieve.py. Weight
    # swept in results/ablation.md.
    # Swept in results/ablation.md. High weight makes the cross-encoder
    # dominant without letting it be absolute: at w=20 exact hit@3 reaches
    # 0.904 and hit@5 0.942, both better than letting it rank alone (0.904 /
    # 0.923), because a passage the bi-encoder is confident about survives the
    # cross-encoder scoring it badly.
    weight: 20.0

generation:
  # Swappable generator interface (R3/R4 mitigation). backend is one of:
  #   openai_compatible  — OpenAI, Groq, DeepSeek, or any /v1-compatible host
  #   anthropic          — Claude models
  backend: openai_compatible
  api_key_env: GROQ_API_KEY
  base_url: https://api.groq.com/openai/v1
  # Model selection is a live R3 (API cost/limits) mitigation, not a
  # preference. Swapping any of these is a config edit; no module imports a
  # model name — which is what made the migration below a one-file change.
  #
  # MIGRATION, 2026-09-03. The provider retired the entire Llama family this
  # project was built on: llama-3.3-70b-versatile (generation) and
  # llama-3.1-8b-instant (rewriting, follow-ups) both return 404
  # model_not_found. A 404 is a bad request, so the R3 fallback chain
  # deliberately does not retry it elsewhere and every question failed.
  # Replacements were chosen by measurement, not availability — see
  # results/model_migration.md for the numbers behind each line here.
  #
  # Generation. qwen3.8-27b matched gpt-oss-120b on citation fidelity over ten
  # gold questions (9/10 cited, 9/10 matching a retrieved passage, 0
  # scaffolding leaks for both) at 0.55s median against 1.32s. Latency decided
  # it: burst latency is the one NFR this system fails, so the faster model of
  # two equals is the right default. Rejected: qwen3.6-27b leaks raw <think>
  # blocks into answers; allam-2-7b reintroduces the "Based on the provided
  # CONTEXT" scaffolding the 8B model was dropped for; groq/compound-* can
  # reach the web, which would break the corpus-only guarantee outright.
  model: qwen/qwen3.8-27b
  # R3 fallback chain, tried in order on rate-limit / quota / overload errors
  # only (a bad request is re-raised, not retried elsewhere). Each provider
  # model carries its own daily allowance, so this keeps the assistant
  # answering when the primary is exhausted. Measured need, not hypothetical:
  # a full 63-question evaluation exhausted the old primary's 100k tokens/day.
  # Both fallbacks are a different family from the primary, so a quota or an
  # outage that takes out qwen does not take out the chain with it.
  fallback_models:
    - openai/gpt-oss-120b
    - openai/gpt-oss-20b
  # Rewriting and follow-ups previously ran on a separate cheap model to
  # spread the daily quota. They now share the generator, because the two
  # gpt-oss models are reasoning models that spend the 120-token budget these
  # calls allow on reasoning and return an empty completion: gpt-oss-20b
  # produced zero usable follow-up lines, gpt-oss-120b two truncated ones.
  # qwen3.8-27b answers both in 13 and 34 completion tokens respectively, so
  # the quota this concentrates is negligible next to a ~1k-token answer.
  rewrite_model: qwen/qwen3.8-27b         # query rewriting (FR4) — cheap + fast
  followup_model: qwen/qwen3.8-27b        # suggested follow-ups (C4)
  temperature: 0.0               # determinism (NFR7)
  max_tokens: 600                # capped token budget (R3)
  timeout_seconds: 30

conversation:
  history_turns: 4               # turns of memory used for query rewriting (S1)

refusal:
  message: >-
    I can't answer that from the course materials I have. My knowledge is
    limited to material issued by the HIT Global Summer School — lecture
    slides and PDFs, lab notebooks, assignment and project briefs, schedules
    and course announcements. Please ask your tutor or check the course
    handbook directly.

intents:
  labels:
    - admin/logistics
    - conceptual
    - code-help
    - out-of-scope/social
  # Intents that bypass retrieval and generation entirely (FR7).
  short_circuit:
    - out-of-scope/social
  # A short-circuit is a hard refusal with no retrieval, so an unconfident
  # router prediction must not trigger one. Measured on the gold set: every
  # correctly routed out-of-scope question scored >= 0.713, while the two
  # in-scope questions wrongly routed out-of-scope scored 0.422 and 0.460.
  # Below this cut-off the turn falls through to retrieval and the similarity
  # gate rules on it instead, so the two refusal layers check each other
  # rather than the router being a single point of failure.
  short_circuit_min_confidence: 0.60
  model_path: index_store/intent_clf.joblib

ui:
  # C4 — suggested follow-up questions. Costs one extra (cheap, capped) call
  # per answered turn, so it is off during evaluation: the harness would pay
  # for work no metric reads, and it would inflate measured latency.
  suggest_followups: true

evaluation:
  results_dir: results
  gold_set: eval/gold_set.json
  hit_at_k: 3                    # NFR2 measures hit@3
  seed: 42                       # NFR7 reproducibility
  # Groundedness judge runs on a different model from the generator, both to
  # spread the daily token quota and so the generator is not marking its own work.
  judge_model: openai/gpt-oss-20b
  # The judge needs its own fallback chain for the same reason generation
  # does: it exhausted its daily allowance mid-run and silently handed most
  # verdicts to the crude lexical fallback, making groundedness look far
  # worse than it was.
  # Shortened by the same retirement. qwen3.8-27b is deliberately NOT listed:
  # it is now the generator, and a fallback that lets the generator mark its
  # own work would quietly defeat the reason this chain is separate at all.
  judge_fallback_models:
    - openai/gpt-oss-120b
