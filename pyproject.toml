[project]
name = "modulemate"
version = "2.4.0"
description = "A private study workspace for your own course materials"
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit>=1.65,<2",
  "pypdf>=6.20.1,<7",
  "python-docx>=1.1.2,<2",
  "python-pptx>=1.0.2,<2",
  "openai>=2,<3",
  "python-dotenv>=1.0.1,<2",
  "scikit-learn>=1.7,<2",
  "snowballstemmer>=3,<4",
  "numpy>=2.1,<3",
  "pillow>=12.1,<13",
  "pypdfium2>=5,<6",
  "pyobjc-framework-vision>=11,<13 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=5.1,<6",
]
local = [
    "mlx-lm>=0.32,<0.33 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "outlines-core>=0.2.14,<0.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
