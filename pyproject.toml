[project]
name = "modulemate"
version = "2.0.0"
description = "A private study workspace for your own course materials"
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit>=1.65,<2",
  "pypdf>=6.20.1,<7",
  "python-docx>=1.1.2,<2",
  "python-pptx>=1.0.2,<2",
  "openai>=2,<3",
  "python-dotenv>=1.0.1,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
